name = "handy-beaver-social-worker"
main = "index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# R2 bucket for generated images (public CDN)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "atlas-collab-pub"

# KV for post history, FB gallery manifest, last post type
[[kv_namespaces]]
binding = "STATE"
id = "0c407b5de5e84cce90f2da02b2c3a31b"

# KV for site gallery images (handy-beaver-assets) — FB sync + fallback image storage
# Same namespace as the main worker's KV binding
[[kv_namespaces]]
binding = "GALLERY"
id = "46d20a7cccba4092a742b320fcdb1643"

# Workers AI for image generation
[ai]
binding = "AI"

[vars]
PAGE_ID = "1040910635768535"
INSTAGRAM_ID = "17841443253800030"
BRAND_NAME = "Handy Beaver Co"

# Cron triggers — Mon/Wed/Fri at 10 AM, 2 PM, 6 PM CST
[triggers]
crons = ["0 16 * * 1,3,5", "0 20 * * 1,3,5", "0 0 * * 2,4,6"]

# Secrets:
# wrangler secret put FB_PAGE_TOKEN
# wrangler secret put FB_APP_ID
# wrangler secret put FB_APP_SECRET
# wrangler secret put IG_TOKEN
# wrangler secret put AUTH_TOKEN

[observability]
enabled = true
