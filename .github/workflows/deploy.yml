name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Strip R2/Browser bindings for CI deploy (bindings already live on worker)
        run: |
          # Wrangler verifies bucket/browser bindings exist — strip them for CI.
          # The live worker retains these bindings; this only affects deploy validation.
          sed -i "/^\[\[r2_buckets\]\]/,/^$/d" wrangler.toml
          sed -i "/^\[browser\]/,/^$/d" wrangler.toml
          echo "--- wrangler.toml after strip ---"
          cat wrangler.toml | grep -E "^\[|^name|^main|^binding" | head -20

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

