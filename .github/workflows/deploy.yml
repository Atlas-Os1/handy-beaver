name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare wrangler.toml for CI
        run: |
          # Strip bindings/triggers that require extra CF permissions to validate.
          # These are already configured on the live worker and are preserved
          # across deploys — wrangler only updates what is explicitly in the toml.
          sed -i "/^\[\[r2_buckets\]\]/,/^$/d" wrangler.toml
          sed -i "/^\[browser\]/,/^$/d" wrangler.toml
          sed -i "/^\[triggers\]/,/^$/d" wrangler.toml
          echo "--- wrangler.toml bindings after strip ---"
          grep -E "^\[|^name|^main|^binding|^database" wrangler.toml

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

